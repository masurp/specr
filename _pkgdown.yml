destination: docs
url: https://masurp.github.io/specr/

template:
  bootstrap: 5
  bootswatch: lumen

reference:
  - title: "Conduct specification curve analysis"
    desc: >
      Core functions of the package that allow to a) setup all specifications, b) fit models across all specifications, and c) conduct inference on the resulting specification curve
    contents:
      - setup
      - specr
      - infer_curve
  - title: "Summarize results"
    desc: >
      All functions above create S3 classes that can be investigated with the generic summary function and transformed to data frames.
    contents:
      - summary.specr.setup
      - summary.specr.object
      - summary.specr.infer
  - title: "Visualizations"
    desc: >
      After running setup(), specr(), or infer_curve(), the resulting S3 class objects can be passed to the generic plot function to create visualizations.
    contents:
      - plot.specr.setup
      - plot.specr.object
      - plot.specr.infer
  - title: "Data set(s)"
    contents:
      - example_data
  - title: "Deprecated"
    desc: >
      The following functions still exist and can be used, but are deprecated from version 1.0.0 on.
    contents:
      - setup_specs
      - run_specs
      - plot_specs
      - plot_curve
      - plot_choices
      - plot_summary
      - plot_samplesizes
      - plot_variance
      - plot_decisiontree
      - summarise_specs
      - icc_specs

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Getting started
      href: articles/getting-started.html
    articles:
      text: Articles
      menu:
      - text: Basics
      - text: Setting up different types of specifications
        href: articles/different-specifications.html
      - text: Visualizing specification curve analyses
        href: articles/custom-plot.html
      - text: Investigating specific specifications
        href: articles/invest-spec.html
      - text: Inferences with specification curve analysis
        href: articles/inferences.html
      - text: Parallelization
        href: articles/parallelization.html
      - text: -------
      - text: Incorporating specific models
      - text: Structural equation models
        href: articles/measurement-models.html
      - text: Multilevel models
        href: articles/multilevel-models.html
      - text: Bayesian models
        href: articles/parallel-bayesian-models.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/masurp/specr
      aria-label: GitHub
